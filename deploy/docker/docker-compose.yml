#version: "3.8"

services:
  ds-mysql:
    image: bitnami/mysql:8.3.0
    ports:
      - "3306:3306"
    profiles: [ "all", "schema" ]
    environment:
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: dolphinscheduler
    volumes:
      - ~/data/docker/dolphinscheduler/ds-mysql:/bitnami/mysql
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/3306" ]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - ds

  ds-zookeeper:
    image: bitnami/zookeeper:3.8.4
    profiles: [ "all" ]
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok,wchs,cons
    volumes:
      - ~/data/docker/dolphinscheduler/ds-zookeeper:/bitnami/zookeeper
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/2181" ]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - ds

  ds-schema-initializer:
    image: ${HUB}/dolphinscheduler-tools:${TAG}
    env_file: .env
    profiles: [ "schema" ]
    command: [ tools/bin/upgrade-schema.sh ]
    depends_on:
      ds-mysql:
        condition: service_healthy
    volumes:
      - ~/data/docker/dolphinscheduler/ds-logs:/opt/dolphinscheduler/logs
      - ~/data/docker/dolphinscheduler/ds-shared-local:/opt/soft
      - ~/data/docker/dolphinscheduler/ds-resource-local:/dolphinscheduler
    networks:
      - ds

  ds-api:
    image: ${HUB}/dolphinscheduler-api:${TAG}
    ports:
      - "12345:12345"
      - "25333:25333"
    profiles: [ "all" ]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:12345/dolphinscheduler/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      ds-zookeeper:
        condition: service_healthy
    volumes:
      - ~/data/docker/dolphinscheduler/ds-logs:/opt/dolphinscheduler/logs
      - ~/data/docker/dolphinscheduler/ds-shared-local:/opt/soft
      - ~/data/docker/dolphinscheduler/ds-resource-local:/dolphinscheduler
    networks:
      - ds

  ds-alert:
    image: ${HUB}/dolphinscheduler-alert-server:${TAG}
    profiles: [ "all" ]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:50053/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      ds-zookeeper:
        condition: service_healthy
    volumes:
      - ~/data/docker/dolphinscheduler/ds-logs:/opt/dolphinscheduler/logs
    networks:
      - ds

  ds-master:
    image: ${HUB}/dolphinscheduler-master:${TAG}
    profiles: [ "all" ]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:5679/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      ds-zookeeper:
        condition: service_healthy
    volumes:
      - ~/data/docker/dolphinscheduler/ds-logs:/opt/dolphinscheduler/logs
      - ~/data/docker/dolphinscheduler/ds-shared-local:/opt/soft
    networks:
      - ds

  ds-worker:
    image: ${HUB}/dolphinscheduler-worker:${TAG}
    profiles: [ "all" ]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:1235/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      ds-zookeeper:
        condition: service_healthy
    volumes:
      - ~/data/docker/dolphinscheduler/ds-worker-data:/tmp/dolphinscheduler
      - ~/data/docker/dolphinscheduler/ds-logs:/opt/dolphinscheduler/logs
      - ~/data/docker/dolphinscheduler/ds-shared-local:/opt/soft
      - ~/data/docker/dolphinscheduler/ds-resource-local:/dolphinscheduler
    networks:
      - ds

networks:
  ds:
    driver: bridge

volumes:
  ds-mysql:
  ds-zookeeper:
  ds-worker-data:
  ds-logs:
  ds-shared-local:
  ds-resource-local:
